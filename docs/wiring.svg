<text x="622" y="476" font-size="13" font-weight="bold" fill="#fff">DC / RS</text>
<rect x="414.0" y="448" width="92" height="16" rx="4" fill="#fff" stroke="#bbb"/>
<text x="460.0" y="460" text-anchor="middle" font-size="10" fill="#666">right header</text>
<rect x="100" y="560" width="370" height="160" rx="9" fill="#1b3a5c" stroke="#102538" stroke-width="2"/>
<text x="285.0" y="586" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Flight controller (ArduPlane)</text>
<text x="285.0" y="604" text-anchor="middle" font-size="11" fill="#9fc4e8">Telemetry UART &#183; MAVLink 2 &#183; 115200 baud</text>
<text x="228" y="636" text-anchor="end" font-size="12" fill="#cfe2f3">Telemetry TX</text>
<path d="M 238 632 L 308 632" stroke="#00897b" stroke-width="4" stroke-linecap="round"/>
<text x="318" y="636" font-size="12" font-weight="bold" fill="#fff">GPIO 44 (RX)</text>
<text x="228" y="664" text-anchor="end" font-size="12" fill="#cfe2f3">GND</text>
<path d="M 238 660 L 308 660" stroke="#424242" stroke-width="4" stroke-linecap="round"/>
<text x="318" y="664" font-size="12" font-weight="bold" fill="#fff">GND</text>
<text x="228" y="692" text-anchor="end" font-size="12" fill="#cfe2f3">5V</text>
<path d="M 238 688 L 308 688" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>
<text x="318" y="692" font-size="12" font-weight="bold" fill="#fff">5V / VBUS</text>
<path d="M 220.0 560 L 220.0 512" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="520" y="560" width="320" height="160" rx="9" fill="#fff4f4" stroke="#b3261e" stroke-width="2"/>
<text x="538" y="592" font-size="14" font-weight="bold" fill="#b3261e">&#9888;  Power</text>
<text x="538" y="618" font-size="12" fill="#5a1f1c">Never connect USB while the flight</text>
<text x="538" y="637" font-size="12" fill="#5a1f1c">controller's 5V wire is attached.</text>
<text x="538" y="675" font-size="12" fill="#5a1f1c">Two 5V sources tied together can push</text>
<text x="538" y="694" font-size="12" fill="#5a1f1c">current back into the flight controller.</text>
<text x="538" y="713" font-size="12" fill="#5a1f1c">Unplug the 5V wire before flashing.</text>
</svg>